items:
  genlite:cobblestone_generator:  # 原石生成器
    # 非方块底材避免客户端预测放置时短暂显示原版方块；放置仍由 block_item 处理。
    material: paper
    data:
      item_name: '<italic:false><#D7AF65>原石生成器'
      # CE 菜单展示一级空库存；拆下后的真实数值由 Genlite 按凭证更新。
      lore:
        - '<italic:false> <#7F8C8D>❖ 基础采集设备'
        - ''
        - '<italic:false> <#89F7FE>▪ <#C2E9FB>内部燃料：<#FFF6B7>0 <#7F8C8D>/ <#FFB75E>512 能量'
        - '<italic:false> <#89F7FE>▪ <#C2E9FB>生产效率：<#A8FF78>每 10 秒 1 个 <#7F8C8D>(耗能 1/个)'
        - '<italic:false> <#89F7FE>▪ <#C2E9FB>默认输出：<#FFFFFF><#FFB75E>⏏ 原地掉落'
        - ''
        - '<italic:false> <#90A4AE>无需原料投入，消耗燃料自动开采 <#E0F7FA>原石<#90A4AE>，'
        - '<italic:false> <#90A4AE>随等级提升可大幅缩短生产耗时并扩容。'
        - ''
        - '<italic:false> <#FFDF00>▶ <#FFF9C4>[右键机器] <#E0F7FA>打开控制面板'
        - '<italic:false> <#FFDF00>▶ <#FFF9C4>[绑定工具] <#E0F7FA>右键连接至收集器'
        - '<italic:false> <#A8FF78>▶ <#78FFD6>[潜行+右键 / 镐挖掘] <#E0F7FA>安全拆除并保留数据'
    model: genlite:item/cobblestone_generator
    behavior:
      type: block_item
      block: genlite:cobblestone_generator  # 原石生成器
