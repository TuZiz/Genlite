items:
  genlite:resource_collector:  # 普通收集器
    material: chest
    data:
      item_name: '<italic:false><#D7AF65>普通收集器[初级]'
      # CE 菜单展示一级空库存；拆下后的真实数值由 Genlite 按凭证更新。
      lore:
        - '<italic:false> <#7F8C8D>❖ 物流仓储终端'
        - ''
        - '<italic:false> <#89F7FE>▪ <#C2E9FB>内部物品：<#FFD700>0 个'
        - '<italic:false> <#89F7FE>▪ <#C2E9FB>已用槽位：<#A8FF78>0 <#7F8C8D>/ <#89F7FE>27 <#7F8C8D>(每格上限 64 个)'
        - ''
        - '<italic:false> <#90A4AE>自动汇集并存储周边生成器的产出物，'
        - '<italic:false> <#90A4AE>有效范围 <#FFB75E>8×8 <#90A4AE>且垂直高度差不超过 <#FFB75E>4 格<#90A4AE>。'
        - ''
        - '<italic:false> <#FFDF00>▶ <#FFF9C4>[右键机器] <#E0F7FA>打开仓储与升级面板'
        - '<italic:false> <#FFDF00>▶ <#FFF9C4>[绑定工具] <#E0F7FA>右键与范围内生成器建立连接'
        - '<italic:false> <#A8FF78>▶ <#78FFD6>[潜行+右键 / 镐挖掘] <#E0F7FA>安全拆除并保留库存'
    model: genlite:item/resource_collector
    behavior:
      type: block_item
      block: genlite:resource_collector  # 普通收集器
