recipes:
  genlite:cobblestone_generator:
    type: shaped
    pattern:
    - CCC
    - CLC
    - CCC
    ingredients:
      C: minecraft:cobblestone
      L: minecraft:oak_log
    result:
      id: genlite:cobblestone_generator
      count: 1
  genlite:timber_generator:
    type: shaped
    pattern:
