# ==========================================
#          资源收集器独立配置
#   修改后正常重启；文本使用 MiniMessage
# ==========================================
schema-version: 1
item-names-version: 1
presentation-version: 1
materials-version: 2
storage-version: 2
id: 普通收集器
base-value: 18

# 实际物品名称与 Lore 由 CraftEngine 定义。
ce-item-version: 1

# 全息字每秒更新一次；height 为相对方块底面的高度，范围 1..4 格。
# 支持 <machine> <level> <status> <fuel> <fuel_capacity> <buffer> <buffer_capacity> <input> <seconds> <count> <value> <used_slots> <slots> <mode> <binding> <locked> <paused>
hologram:
  layout-version: 2
  enabled: true
  height: 1.05
  scale: 0.65
  lines:
    - '<machine>'
    - '<status> <#5C6B73>| <#89F7FE>📦 <#C2E9FB>仓储：<#A8FF78><used_slots><#7F8C8D>/<#89F7FE><slots> 槽'

# x/z 相对坐标各 -4..3，恰好 8×8；高度差单位为格。
collection:
  min-offset: -4
  max-offset: 3
  max-height-difference: 4

# 仓储固定 27 个普通物品格，每格最多 64 个。
levels:
  '1':
    value-multiplier: 1.0
    slots: 27
  '2':
    value-multiplier: 1.5
    slots: 27
  '3':
    value-multiplier: 2.0
    slots: 27
  '4':
    value-multiplier: 2.8
    slots: 27
  '5':
    value-multiplier: 4.0
    slots: 27

# 目标等级及其所需材料，可按每种机器单独修改。
upgrades:
  '2':
    原石: 64
    橡木原木: 16
  '3':
    铁锭: 32
    橡木原木: 32
    原石: 128
  '4':
    铁锭: 96
    箱子: 4
    原石: 256
  '5':
    铁锭: 192
    箱子: 8
    原石: 512