# ==========================================
#          原石生成器独立配置
#   修改后正常重启；文本使用 MiniMessage
# ==========================================
schema-version: 1
item-names-version: 1
presentation-version: 1
materials-version: 2
upgrade-item-version: 1
id: 原石生成器
base-value: 6

# 实际物品名称与 Lore 由 CraftEngine 定义。
ce-item-version: 1

# 全息字每秒更新一次；height 为相对方块底面的高度，范围 1..4 格。
# 支持 <machine> <level> <status> <fuel> <fuel_capacity> <input> <seconds> <count> <value> <used_slots> <slots> <mode> <binding> <locked> <paused>
hologram:
  layout-version: 2
  enabled: true
  height: 1.05
  scale: 0.65
  lines:
    - '<machine>'
    - '<status> <#5C6B73>| <#E0F7FA><mode>'
    - '<#FFB75E>🔥 <#FFE0B2>燃料：<#FFF6B7><fuel><#7F8C8D>/<#FFB75E><fuel_capacity>'

# 每个燃料物品兑换的燃料单位；只在实际生产时消耗。
fuel:
  item: 燃料
  units-per-item: 8

production:
  output: 原石
  fuel-per-item: 1

# 生产间隔单位秒，至少 5 秒；单次最多 2 个；最高产能不超过一级 4 倍。
levels:
  '1':
    interval-seconds: 10
    output-count: 1
    fuel-capacity-items: 64
    buffer-capacity-items: 64
    value-multiplier: 1.0
  '2':
    interval-seconds: 8
    output-count: 1
    fuel-capacity-items: 128
    buffer-capacity-items: 128
    value-multiplier: 1.5
  '3':
    interval-seconds: 8
    output-count: 2
    fuel-capacity-items: 192
    buffer-capacity-items: 192
    value-multiplier: 2.0
  '4':
    interval-seconds: 6
    output-count: 2
    fuel-capacity-items: 256
    buffer-capacity-items: 256
    value-multiplier: 2.8
  '5':
    interval-seconds: 5
    output-count: 2
    fuel-capacity-items: 320
    buffer-capacity-items: 320
    value-multiplier: 4.0

# 每次升一级只消耗初级升级单元；数量可按生成器单独调整。
upgrades:
  '2':
    初级升级单元: 2
  '3':
    初级升级单元: 6
  '4':
    初级升级单元: 16
  '5':
    初级升级单元: 40